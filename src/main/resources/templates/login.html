<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login Page</title>
    <style>
        form {
            max-width: 400px;
            margin: auto;
            padding: 1em;
            border: 1px solid #ccc;
            border-radius: 1em;
        }
        label {
            margin-top: 1em;
            display: block;
        }
        input {
            width: 95%;
            padding: .7em;
            margin-top: .5em;
        }
        button {
            margin-top: 1em;
            padding: 0.7em;
            width: 100%;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: .3em;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 1em;
        }
    </style>
		<script type="module">
			import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
			import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider, TwitterAuthProvider } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

			const firebaseConfig = {
					apiKey: "AIzaSyBaxL0-c4n8NodwscctIdgi6anKzykOwiM",
					authDomain: "booking-7178f.firebaseapp.com",
					projectId: "booking-7178f",
					storageBucket: "booking-7178f.firebasestorage.app",
					messagingSenderId: "693342859916",
					appId: "1:693342859916:web:265aa9b71788cb7cf4c1a9",
					measurementId: "G-M9647B3WSZ"
			};

			const app = initializeApp(firebaseConfig);
			const auth = getAuth(app);

			async function verifyToken(idToken) {
				try {
					const response = await fetch('/api/auth/verify-token', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ idToken: idToken })
					});
					const data = await response.json();
					if (data.statusCode === 200) {
						console.log("Token verification result:", data.data.token);
						// Submit token via form POST to create Spring Security session
						const form = document.getElementById('socialCallbackForm');
						document.getElementById('socialToken').value = data.data.token;
						form.submit();
					} else {
						console.error("Token verification failed:", data);
					}
				} catch (error) {
					console.error("Error sending token to backend:", error);
				}
			}

			// Google Login
			document.getElementById('googleLoginBtn').onclick = () => {
					const provider = new GoogleAuthProvider();
					signInWithPopup(auth, provider)
							.then(async (result) => {
								const idToken = await result.user.getIdToken();
								console.log("Google login successful idToken:", idToken);
								const user = result.user;
								await verifyToken(idToken);
							})
							.catch((error) => {
									console.error("Google login error:", error.message);
							});
			};

			// Facebook Login
			document.getElementById('facebookLoginBtn').onclick = () => {
					const provider = new FacebookAuthProvider();
					signInWithPopup(auth, provider)
							.then(async (result) => {
								const idToken = await result.user.getIdToken();
								console.log("Facebook login successful idToken:", idToken);
								const user = result.user;
								await verifyToken(idToken);
							})
							.catch((error) => {
									console.error("Facebook login error:", error.message);
							});
			};

			// Twitter Login
			document.getElementById('twitterLoginBtn').onclick = () => {
					const provider = new TwitterAuthProvider();
					signInWithPopup(auth, provider)
							.then(async (result) => {
								const idToken = await result.user.getIdToken();
								console.log("Twitter login successful idToken:", idToken);
								const user = result.user;
								await verifyToken(idToken);
							})
							.catch((error) => {
									console.error("Twitter login error:", error.message);
							});
			};

    </script>
</head>
<body>
    
    <div th:if="${param.logout}" style="color: green;">
        You have been logged out.
    </div>

    <h2 style="text-align: center;">Login</h2>
    <form th:action="@{/login}" method="post">
        <div>
            <label>Username:</label>
            <input type="text" name="username" required />
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" required />
        </div>
        <button type="submit">Log In</button>
    </form>

		<div style="text-align: center; margin-top: 20px;">
			<p style="margin-bottom: 0px;">Or sign in with your social media account</p>
			<div id="socialLoginButtons" style="display: flex; justify-content: center; gap: 15px;">
				<button id="facebookLoginBtn" style="width: 50px; height: 50px; border-radius: 50%; border: none; background-color: #3b5998; color: white; font-size: 1.3em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;">f</button>
				<button id="twitterLoginBtn" style="width: 50px; height: 50px; border-radius: 50%; border: none; background-color: #1DA1F2; color: white; font-size: 1.3em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;">t</button>
				<button id="googleLoginBtn" style="width: 50px; height: 50px; border-radius: 50%; border: none; background-color: #DB4437; color: white; font-size: 1.3em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;">G</button>
			</div>
		</div>
    <!-- hidden form for social login callback -->
    <form id="socialCallbackForm" method="post" th:action="@{/auth/social-callback}" style="display:none;">
      <input type="hidden" id="socialToken" name="token" />
    </form>

    <!-- register button -->
    <a th:href="@{/register}">Register</a>

    <div th:if="${loginError}" style="color: red;">
      <p th:text="${errorMessage}"></p>
    </div>
  
    <script>
			if (window.location.search.includes('error')) {
        const url = new URL(window.location);
        url.searchParams.delete('error');
        window.history.replaceState({}, '', url);
			}
    </script>
</body>
</html>
