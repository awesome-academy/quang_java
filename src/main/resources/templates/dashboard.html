<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/paginationjs/2.6.0/pagination.css"/>

    <!-- jQuery (bắt buộc) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- pagination.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paginationjs/2.6.0/pagination.min.js"></script> 
    <script>
      // get token from url ?jwtTken and save to localStorage
      const urlParams = new URLSearchParams(window.location.search);
      const jwtToken = urlParams.get('jwtToken');
      if (jwtToken) {
        localStorage.setItem("jwtToken", jwtToken);
        // remove token and ? from url
        urlParams.delete('jwtToken');
        const newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
        window.history.replaceState({}, '', newUrl);
      }
    </script>
</head>
<body>
  <div id="dashboard" style="display: flex; height: 100vh;">
    <div id="left-pannel" style="flex:0 0 30%; min-width: 255px; max-width: 300px;">
      <div id="menu-bar" style="height: 100vh; background-color: #f0f0f0; padding: 20px;">
        <ul style="list-style-type: none; padding: 0;">
          <li><a onclick="selectPanel('revenue-management')" href="#">Revenue Management</a></li>
          <li><a onclick="selectPanel('user-management')" href="#">Users Management</a></li>
          <li><a onclick="selectPanel('tours-management')" href="#">Tours & Categories Management</a></li>
          <li><a onclick="selectPanel('reviews-management')" href="#">Reviews Management</a></li>
          <li><a onclick="selectPanel('bookings-management')" href="#">Bookings Management</a></li>
        </ul>
      </div>
    </div>

    <div id="right-panel" style="flex: 1;">
      <!-- Top bar  -->
      <div id="top-bar" style="height: 50px; background-color: #e0e0e0; display: flex; align-items: center; justify-content: flex-end; padding: 0 20px;">
        <!-- load user name from   model.addAttribute("username", username);-->
        <p style="margin-right: 10px;">Welcome, <a th:href="@{/user/info}" th:text="${username}">User</a>!</p>
        <button onclick="logout()">Logout</button>
      </div>

      <!-- Main content -->

        <div id="revenue-management">

          <div id="revenue-data"></div>
        </div>
        <div id="user-management">
          <h2>Users Management</h2>
          <div id="user-container"></div>
          <div id="user-pagination" style="display: flex; justify-content: center; margin-top: 10px;"></div>
        </div>
        <div id="tours-management">
          <h2>Tours & Categories Management</h2>
          <div id="categories-data">
            <h3>Categories Management</h3>
            <button onclick="showFormAddCategory()" style="margin-bottom: 10px;">Add Category</button>
            <div id="category-container"></div>
            <div id="category-pagination" style="display: flex; justify-content: center; margin-top: 10px;"></div>
          </div>
          <div id="tours-data">
            <h3>Tours Management</h3>
            <button onclick="showFormAddTour()" style="margin-bottom: 10px;">Add Tour</button>
            <div id="tour-container"></div>
            <div id="tour-pagination" style="display: flex; justify-content: center; margin-top: 10px;"></div>
          </div>
        </div>
        <div id="reviews-management">
          <h2>Reviews Management</h2>
          <div id="reviews-container"></div>
          <div id="reviews-pagination" style="display: flex; justify-content: center; margin-top: 10px;"></div>
        </div>
        <div id="bookings-management">
          <h2>Bookings Management</h2>
          <div id="bookings-data"></div>
        </div>
      </div>
    </div>

    <div id="add-user-form" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; padding: 20px; border: 1px solid #ccc;">
      <form id="add-user-form-element">
        <div>
          <label for="add-user-username">Username:</label>
          <input type="text" id="add-user-username" name="username" required />
        </div>
        <div>
          <label for="add-user-email">Email:</label>
          <input type="email" id="add-user-email" name="email" required />
        </div>
        <div>
          <label for="add-user-password">Password:</label>
          <input type="password" id="add-user-password" name="password" required />
        </div>
        <div>
          <label for="add-user-password-confirmation">Confirm Password:</label>
          <input type="password" id="add-user-password-confirmation" name="passwordConfirmation" required />
        </div>
        <button type="button" onclick="addUser()">Save</button>
        <button type="button" onclick="document.getElementById('add-user-form').style.display='none';">Cancel</button>

    <div id="edit-user-form" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; padding: 20px; border: 1px solid #ccc;">

        <input type="hidden" id="edit-user-id" name="id" />
        <div>
          <label for="edit-user-username">Username:</label>
          <input type="text" id="edit-user-username" name="username" required />
        </div>
        <div>
          <label for="edit-user-email">Email:</label>
          <input type="email" id="edit-user-email" name="email" required />
        </div>
        <button type="button" onclick="updateUser()">Save</button>
        <button type="button" onclick="document.getElementById('edit-user-form').style.display='none';">Cancel</button>
      </form>
    </div>

    <div id="add-tour-form" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; padding: 20px; border: 1px solid #ccc;">

          <input type="text" id="add-tour-title" name="title" required />

        </div>

          <label for="add-tour-price">Price:</label>

        </div>
        <div>
          <label for="add-tour-category">Category:</label>
          <select id="add-tour-category" name="categoryId" required>
            <!-- load categories from /api/categories/ and fill options -->

        <div>

          <input type="text" id="add-tour-image" name="imageUrl" required />
        </div>
        <button type="button" onclick="addTour()">Save</button>
        <button type="button" onclick="document.getElementById('add-tour-form').style.display='none';">Cancel</button>
      </form>
    </div>

    <div id="edit-tour-form" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; padding: 20px; border: 1px solid #ccc;">
      <form id="edit-tour-form-element">
        <input type="hidden" id="edit-tour-id" name="id" />
        <div>
          <label for="edit-tour-title">Title:</label>
          <input type="text" id="edit-tour-title" name="title" required />
        </div>
        <div>
          <label for="edit-tour-description">Description:</label>
          <textarea id="edit-tour-description" name="description" required></textarea>
        </div>
        <div>
          <label for="edit-tour-price">Price:</label>
          <input type="number" id="edit-tour-price" name="price" required />
        </div>
        <div>
          <label for="edit-tour-category">Category:</label>
          <select id="edit-tour-category" name="categoryId" required>
            <!-- load categories from /api/categories/ and fill options -->
          </select>
        </div>
        <div>
          <label for="edit-tour-image">Image URL:</label>
          <input type="text" id="edit-tour-image" name="imageUrl" required />
        </div>

        <button type="button" onclick="document.getElementById('edit-tour-form').style.display='none';">Cancel</button>

    <div id="add-category-form" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; padding: 20px; border: 1px solid #ccc;">
      <form id="add-category-form-element">
        <div>
          <label for="add-category-name">Name:</label>
          <input type="text" id="add-category-name" name="name" required />
        </div>
        <div>
          <label for="add-category-description">Description:</label>
          <textarea id="add-category-description" name="description" required></textarea>
        </div>

        <button type="button" onclick="document.getElementById('add-category-form').style.display='none';">Cancel</button>
      </form>

    <div id="update-category-form" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; padding: 20px; border: 1px solid #ccc;">
      <form id="update-category-form-element">
        <input type="hidden" id="edit-category-id" name="id" />
        <div>
          <label for="edit-category-name">Name:</label>
          <input type="text" id="edit-category-name" name="name" required />
        </div>
        <div>
          <label for="edit-category-description">Description:</label>
          <textarea id="edit-category-description" name="description" required></textarea>
        </div>
        <button type="button" onclick="updateCategory()">Save</button>
        <button type="button" onclick="document.getElementById('update-category-form').style.display='none';">Cancel</button>

    <script>
      function selectPanel(panelId) {

        console.log("Selected panel:", panelId);

        const menuBar = document.getElementById('menu-bar');
        const links = menuBar.querySelectorAll('ul li a');
        links.forEach(link => {
          if (link.getAttribute('onclick').includes(panelId)) {
            link.style.backgroundColor = 'blue';
            link.style.color = 'white';
            link.style.fontWeight = 'bold';
          } else {
            link.style.backgroundColor = '';
            link.style.color = '';
            link.style.fontWeight = 'normal';
          }
        });
        const panels = ['revenue-management', 'user-management', 'tours-management', 'reviews-management', 'bookings-management'];
        panels.forEach(id => {
          document.getElementById(id).style.display = (id === panelId) ? 'block' : 'none';
        });

        if (panelId === 'user-management') loadUsers();
        if (panelId === 'tours-management') {
          getAllCategories();
          loadCategories(); 
          loadTours();
        }
        if(panelId === 'reviews-management') loadUserReviews();
      }
      selectPanel('revenue-management');

      // User management functions

      function loadUsers() {
        $('#user-pagination').pagination({
          dataSource: '/api/users/',
          locator:'data.content',
          totalNumberLocator: (response) => response.data.totalElements,
          alias: {
            pageNumber: 'page',
            pageSize: 'size'
          },
          pageSize: 5,
          ajax: {
            beforeSend: function(xhr) {
              xhr.setRequestHeader(
                'Authorization',
                'Bearer ' + localStorage.getItem('jwtToken')
              );
            }
          },
          callback: function(data, pagination) {
            console.log("Users data:", data);
            renderUsers(data);
          }
        });
      }

      function renderUsers(users) {
        const container = document.getElementById("user-container");
        let html = '<table border="1" style="width:100%;border-collapse:collapse;"><tr>';
          Object.keys(users[0]).forEach(key => {
            html += `<th>${key}</th>`;
          });
          html += '<th>Actions</th>';
          html += '</tr>';
          users.forEach(u => {
            html += '<tr>';
            Object.values(u).forEach(val => {
              html += `<td>${val === null ? '' : val}</td>`;
            });
            html += `<td>
                        <button onclick="showFormUpdateUser(${u.id})">Edit</button> 
                        <button onclick="deleteUser(${u.id})">Delete</button>
                      </td>`;
            html += '</tr>';
          });
          html += '</table>';
        container.innerHTML = html;
      }

      function showFormAddUser() {
        document.getElementById('add-user-form').style.display = 'block';
      }

      function addUser() {
        const username = document.getElementById('add-user-username').value;
        const email = document.getElementById('add-user-email').value;
        const password = document.getElementById('add-user-password').value;
        const passwordConfirmation = document.getElementById('add-user-password-confirmation').value;

        if (password !== passwordConfirmation) {
          alert('Password and confirmation do not match');
          return;
        }

        fetch('/api/users/create', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            },
            body: JSON.stringify({ username, email, password })
          })
          .then(res => {
            if (res.ok) {
              alert('User added successfully');
              document.getElementById('add-user-form').style.display = 'none';
              loadUsers();
            } else {
              alert('Failed to add user');
            }
          })
          .catch(err => {
            alert('Error adding user: ' + err);
            console.error("Error adding user:", err);
          });
      }

      function showFormUpdateUser(userId) {
        // open form edit-user-form and fill data of user with id = userId
        fetch('/api/users/detail/' + userId, {
            headers: {
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            }
          })
          .then(res => res.json())
          .then(data => {
            console.log("User data for editing:", data);
            const user = data && data.data ? data.data : null;
            if (user) {
              document.getElementById('edit-user-form').style.display = 'block';
              document.getElementById('edit-user-id').value = user.id;
              document.getElementById('edit-user-username').value = user.username || '';
              document.getElementById('edit-user-email').value = user.email || '';
              document.getElementById('edit-user-form').style.display = 'block';
            } else {
              alert('User not found');
            }
          })
          .catch(err => {
            alert('Error loading user data: ' + err);
            console.error("Error loading user data for editing:", err);
          });
        
      }

      function updateUser() {
        const userId = document.getElementById('edit-user-id').value;
        const username = document.getElementById('edit-user-username').value;
        const email = document.getElementById('edit-user-email').value;

        fetch('/api/users/update/' + userId, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            },
            body: JSON.stringify({ username, email })
          })
          .then(res => {
            if (res.ok) {
              alert('User updated successfully');
              document.getElementById('edit-user-form').style.display = 'none';
              loadUsers();
            } else {
              alert('Failed to update user');
            }
          })
          .catch(err => {
            alert('Error updating user: ' + err);
            console.error("Error updating user:", err);
          });
      }

      function deleteUser(userId) {
        if (confirm('Are you sure you want to delete user with ID: ' + userId + '?')) {
          fetch('/api/users/delete/' + userId, {
              method: 'DELETE',
              headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
              }
            })
            .then(res => {
              if (res.ok) {
                alert('User deleted successfully');
                loadUsers();
              } else {
                alert('Failed to delete user');
              }
            })
            .catch(err => {
              alert('Error deleting user: ' + err);
              console.error("Error deleting user:", err);
            });
        }
      }
      
      // Tours & Categories management functions

      function getAllCategories() {
        fetch('/api/categories/all', {
            headers: {
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            }
          })
          .then(res => res.json())
          .then(data => {
            console.log("All categories data:", data);
            const categories = data && data.data ? data.data : [];
            const categorySelects = document.querySelectorAll('#add-tour-category, #edit-tour-category');
            categorySelects.forEach(select => {
              select.innerHTML = '';
              categories.forEach(category => {  
                const option = document.createElement('option');
                option.value = category.id;
                option.textContent = category.name;
                select.appendChild(option);
              });
            });
          })
          .catch(err => {
            alert('Error loading categories: ' + err);
            console.error("Error loading categories:", err);
          });
      }

      function loadCategories() {
        $('#category-pagination').pagination({
          dataSource: '/api/categories/',
          locator:'data.content',
          totalNumberLocator: (response) => response.data.totalElements,
          alias: {
            pageNumber: 'page',
            pageSize: 'size'
          },
          pageSize: 5,
          ajax: {
            beforeSend: function(xhr) {
              xhr.setRequestHeader(
                'Authorization',
                'Bearer ' + localStorage.getItem('jwtToken')
              );
            }
          },
          callback: function(data, pagination) {
            console.log("Categories data:", data);
            renderCategories(data);
          }
        });
      }

      function renderCategories(categories) {
        const container = document.getElementById("category-container");
        let html = '<table border="1" style="width:100%;border-collapse:collapse;"><tr>';
          Object.keys(categories[0]).forEach(key => {
            html += `<th>${key}</th>`;
          });
          html += '<th>Actions</th>';
          html += '</tr>';
          categories.forEach(c => {
            html += '<tr>';
            Object.values(c).forEach(val => {
              html += `<td>${val === null ? '' : val}</td>`;
            });
            html += `<td>
                        <button onclick="showFormUpdateCategory(${c.id})">Edit</button> 
                        <button onclick="deleteCategory(${c.id})">Delete</button>
                      </td>`;
            html += '</tr>';
          });
          html += '</table>';
        container.innerHTML = html;
      }

      function showFormAddCategory() {
        document.getElementById('add-category-form').style.display = 'block';
      }

      function addCategory() {
        fetch('/api/categories/create', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            },
            body: JSON.stringify({
              name: document.getElementById('add-category-name').value,
              description: document.getElementById('add-category-description').value
            })  
          })
          .then(res => {
            if (res.ok) {
              alert('Category added successfully'); 
              document.getElementById('add-category-form').style.display = 'none';
              loadCategories();
              getAllCategories();
            } else {
              alert('Failed to add category');
            }
          });
      }

      function showFormUpdateCategory(categoryId) {
        console.log("Show form to edit category with ID:", categoryId);
        document.getElementById('update-category-form').style.display = 'block';
        fetch('/api/categories/detail/' + categoryId, {
            headers: {
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            }
          })
          .then(res => res.json())
          .then(data => {
            document.getElementById('edit-category-id').value = data.data.id;
            document.getElementById('edit-category-name').value = data.data.name;
            document.getElementById('edit-category-description').value = data.data.description;
          });
      }

      function updateCategory() {
        fetch('/api/categories/update/' + document.getElementById('edit-category-id').value, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            },
            body: JSON.stringify({
              name: document.getElementById('edit-category-name').value,
              description: document.getElementById('edit-category-description').value
            })
          })
          .then(res => {
            if (res.ok) {
              alert('Category updated successfully');
              document.getElementById('update-category-form').style.display = 'none';
              loadCategories();
              getAllCategories();
            } else {
              alert('Failed to update category');
            }
          });
      }

      function deleteCategory(categoryId) {
        fetch('/api/categories/delete/' + categoryId, {
            method: 'DELETE',
            headers: {
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            }
          })
          .then(res => {
            if (res.ok) {
              alert('Category deleted successfully');
              loadCategories();
              getAllCategories();
            } else {
              alert('Failed to delete category');
            }
          });
      }

      function loadTours() {
        $('#tour-pagination').pagination({
          dataSource: '/api/tours/',
          locator:'data.content',
          totalNumberLocator: (response) => response.data.totalElements,
          alias: {
            pageNumber: 'page',
            pageSize: 'size'
          },
          pageSize: 5,
          ajax: {
            beforeSend: function(xhr) {
              xhr.setRequestHeader(
                'Authorization',
                'Bearer ' + localStorage.getItem('jwtToken')
              );
            }
          },
          callback: function(data, pagination) {
            renderTours(data);
          }
        });
      }

      function renderTours(tour) {
        const container = document.getElementById("tour-container");
        let html = '<table border="1" style="width:100%;border-collapse:collapse;"><tr>';
          Object.keys(tour[0]).forEach(key => {
            // change key imageUrl to Image
            if (key === 'imageUrl') html += `<th>Image</th>`;
            else  html += `<th>${key}</th>`;
          });
          html += '<th>Actions</th>';
          html += '</tr>';
          tour.forEach(t => {
            html += '<tr>';
            Object.keys(t).forEach(key => {
              // load image from t.imageUrl and show in column image
              if (key === 'imageUrl') {
                html += `<td><img src="${t[key]}" alt="Tour Image" style="width:100px;height:auto;"></td>`;
              } else {
                html += `<td>${t[key] === null ? '' : t[key]}</td>`;
              }
            });
            html += `<td>
                        <button onclick="showFormUpdateTour(${t.id})">Edit</button> 
                        <button onclick="deleteTour(${t.id})">Delete</button>
                      </td>`;
            html += '</tr>';
          });
          html += '</table>';
        container.innerHTML = html;
      }

      function showFormAddTour() {
        document.getElementById('add-tour-form').style.display = 'block';
      }

      function addTour() {
        fetch('/api/tours/create', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            },
            body: JSON.stringify({
              title: document.getElementById('add-tour-title').value,
              description: document.getElementById('add-tour-description').value,
              price: parseFloat(document.getElementById('add-tour-price').value),
              categoryId: parseInt(document.getElementById('add-tour-category').value),
              imageUrl: document.getElementById('add-tour-image').value
            })
          })
          .then(res => {
            if (res.ok) {
              alert('Tour added successfully');
              document.getElementById('add-tour-form').style.display = 'none';
              loadTours();
            } else {
              alert('Failed to add tour');
            }
          });
      }

      function showFormUpdateTour(tourId) {
        console.log("Show form to edit tour with ID:", tourId);
        document.getElementById('edit-tour-form').style.display = 'block';
        fetch('/api/tours/detail/' + tourId, {
            headers: {
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            }
          })
          .then(res => res.json())
          .then(data => {
            document.getElementById('edit-tour-id').value = data.data.id;
            document.getElementById('edit-tour-title').value = data.data.title;
            document.getElementById('edit-tour-description').value = data.data.description;
            document.getElementById('edit-tour-price').value = data.data.price;
            document.getElementById('edit-tour-category').value = data.data.categoryId;
            document.getElementById('edit-tour-image').value = data.data.imageUrl;
          });
      }

      function updateTour() {
        fetch('/api/tours/update/' + document.getElementById('edit-tour-id').value, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            },
            body: JSON.stringify({
              title: document.getElementById('edit-tour-title').value,
              description: document.getElementById('edit-tour-description').value,
              price: parseFloat(document.getElementById('edit-tour-price').value),
              categoryId: parseInt(document.getElementById('edit-tour-category').value),
              imageUrl: document.getElementById('edit-tour-image').value
            })
          })
          .then(res => {
            if (res.ok) {
              alert('Tour updated successfully');
              document.getElementById('edit-tour-form').style.display = 'none';
              loadTours();
            } else {
              alert('Failed to update tour');
            }
          });
      }

      function deleteTour(tourId) {
        fetch('/api/tours/delete/' + tourId, {
            method: 'DELETE',
            headers: {
              'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
            }
          })
          .then(res => {
            if (res.ok) {
              alert('Tour deleted successfully');
              loadTours();
            } else {
              alert('Failed to delete tour');
            }
          });
      }

      // Reviews management functions

      function loadUserReviews() {
        $('#reviews-pagination').pagination({
          dataSource: '/api/reviews/all',
          locator:'data.content',
          totalNumberLocator: (response) => response.data.totalElements,
          alias: {
            pageNumber: 'page',
            pageSize: 'size'
          },
          pageSize: 5,
          ajax: {
            beforeSend: function(xhr) {
              xhr.setRequestHeader(
                'Authorization',
                'Bearer ' + localStorage.getItem('jwtToken')
              );
            }
          },
          callback: function(data, pagination) {
            console.log("Reviews data:", data);
            renderReviews(data);
          }
        });
      }

      function renderReviews(reviews) {
        const container = document.getElementById("reviews-container");
        let html = '<table border="1" style="width:100%;border-collapse:collapse;"><tr>';
          Object.keys(reviews[0]).forEach(key => {
            html += `<th>${key}</th>`;
          });
          html += '</tr>';
          reviews.forEach(r => {
            html += '<tr>';
            Object.values(r).forEach(val => {
              // tour is object, show tour.title
              if (val && typeof val === 'object' && val.title) {
                html += `<td>${val.title} - ${val.description} - ${val.price}</td>`;
              } else {
                html += `<td>${val === null ? '' : val}</td>`;
              }
            });
            html += '</tr>';
          });
          html += '</table>';
        container.innerHTML = html;
      }

      function logout() {
        localStorage.removeItem('jwtToken');
        window.location.href = '/login';
      }
    </script>
  </div>
</body>
</html>
