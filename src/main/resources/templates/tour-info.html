<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tour Info</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/paginationjs/2.6.0/pagination.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paginationjs/2.6.0/pagination.min.js"></script> 
</head>
<body>
  <h1 th:text="${tour.title}">Tour Title</h1>
  <img th:src="${tour.imageUrl}" alt="Tour Image" style="width: 400px; height: 300px; object-fit: cover;">
  <p th:text="${tour.description}">Tour Description</p>
  <p>Price: <span th:text="${tour.price}">0</span></p>
  <p>Category ID: <span th:text="${tour.categoryId}">0</span></p>

  <div id="tour-rating">
    <h2>Submit Your Rating</h2>
    <input type="number" id="rating-input" min="1" max="5" step="0.5" value="0">
    <input type="text" id="comment-input" placeholder="Write your review here..." style="display: block; margin-top: 10px; width: 300px; height: 100px;">
    <button style="margin-top: 10px;" id="submit-rating" onclick="submitReview()">Submit Rating</button>
  </div>

  <div id="tour-reviews">
    <h2>User Reviews</h2>
    <div id="reviews-container"></div>
    <div style="margin-top: 20px;" id="reviews-pagination"></div>
  </div>

  <button onclick="window.location.href='/home'" style="margin-top: 20px;">Back to Feed</button>

  <script>
    // get url tour/{id} to extract tour id
    const pathParts = window.location.pathname.split('/');
    const tourId = pathParts[pathParts.length - 1];
    localStorage.setItem('tourId', tourId);

    $(document).ready(function() {
      loadTourReviews();
    });

    function loadTourReviews() {
      $('#reviews-pagination').pagination({
        dataSource: `/api/reviews/tour/${tourId}`,
        locator:'data.content',
        totalNumberLocator: (response) => response.data.totalElements,
        alias: {
          pageNumber: 'page',
          pageSize: 'size'
        },
        pageSize: 5,
        ajax: {
          beforeSend: function(xhr) {
              xhr.setRequestHeader(
              'Authorization', 
              'Bearer ' + localStorage.getItem('jwtToken')
            );
          }
        },
        callback: function(data, pagination) {
          let html = '<table border="1" cellpadding="5" cellspacing="0"><tr><th>ID</th><th>Tour</th><th>Rating</th><th>Comment</th></tr>';
          data.forEach(r => {
            html += '<tr>';
            Object.values(r).forEach(val => {
              if(val && typeof val === 'object') {
                html += `<td>${r.tour.title} - ${r.tour.description} - ${r.tour.price}</td>`;
              }else {
                html += `<td>${val === null ? '' : val}</td>`;
              }
            });
            html += '</tr>';
          });
          html += '</table>';
          $('#reviews-container').html(html);
        }
      });
    }

    function submitReview() {
      const rating = $('#rating-input').val();
      const comment = $('#comment-input').val();
      fetch('/api/reviews/write', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
        },
        body: JSON.stringify({
          tour: { id: localStorage.getItem('tourId') },
          rating: Number(rating),
          content: comment,
          userId: localStorage.getItem('userId')
        })
      })
      .then(response => { 
        if(response.ok) {
          alert('Review submitted successfully!');
          $('#rating-input').val(0);
          $('#comment-input').val('');
          loadTourReviews();
        } else {
          alert('Failed to submit review. Please try again.');
        }
      })
    }  
  </script>
</body>

</html>
