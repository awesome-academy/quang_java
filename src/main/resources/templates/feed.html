<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Feed</title>
    <link rel="icon" href="data:,">
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const tokenElement = document.querySelector("#user-info p");
        if (tokenElement) {
          const token = tokenElement.textContent.trim();
          if (token) {
            localStorage.setItem("jwtToken", token);
          }
        }

        const userIdElement = document.querySelector("#user-info p:nth-child(2)");
        if (userIdElement) {
          const userId = userIdElement.textContent.trim();
          if (userId) {
            localStorage.setItem("userId", userId);
          }
        }
      });
    </script>
</head>
<body>
  <div id="user-info" hidden>
    <p th:text="${jwtToken}"></p>
    <p th:text="${userId}"></p>
  </div>
  <div id="user-info" style="display: flex; align-items: center; gap: 10px; justify-content: flex-end;">
    <p>Welcome,<a th:href="@{/user/info}" th:text="${username}">User</a>!</p>
    <form th:action="@{/logout}" method="post" style="display:inline;">
      <button type="submit">Logout</button>
    </form>
  </div>

  <div id="search-info">
    <h2>Search for Bookings</h2>
    <form th:action="@{/search}" method="get" style="display: flex; gap: 10px; margin-top: 10px;">
      <input type="text" name="query" placeholder="Search by destination, date, etc." style="flex: 1; padding: 8px;">
      <div style="position: relative; display: inline-block;">
        <span style="position: absolute; left: 8px; top: 50%; transform: translateY(-50%); pointer-events: none;">&#9776;</span>
        <select id="order-by" name="filter" style="padding: 8px 8px 8px 28px; min-width: 150px;">
          <option value="rating">Rating</option>
          <option value="date">Date Posted</option>
          <option value="comments">User Comments</option>
        </select>
      </div>
      <button type="submit" style="padding: 8px 16px;">Search</button>
    </form>
  </div>

  <div id="feed-content" style="margin-top: 30px;">
    <div th:each="tour : ${tours}">
      <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; display: flex; gap: 15px; height: 110px; overflow: hidden;">
        <img th:src="${tour.imageUrl}" alt="Tour Image" style="width: 150px; height: 110px; object-fit: cover;">
        <div style="overflow: hidden;">
          <h3 style="margin: 0px 0px 5px 0px; text-decoration: underline;"><a th:href="@{/tour/{id}(id=${tour.id})}" th:text="${tour.title}" style="margin: 0 0 3px 0; text-decoration: none; color: inherit;">Tour Title</a></h3>
          <p th:text="${tour.description}" style="margin: 0 0 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Tour Description</p>
          <p style="margin: 0 0 3px 0;"><strong>Price:</strong> $<span th:text="${tour.price}">0.00</span></p>
          <p style="margin: 0 0 3px 0;"><strong>Rating:</strong> <span th:text="${tour.rating}">0.0</span>/5</p>
          <p style="margin: 0;"><strong>Comments:</strong> <span th:text="${tour.reviewsCount}">0</span></p>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${totalPages > 1}" id="pagination" style="text-align: center; margin-top: 20px;">
    <a th:if="${curPage > 0}" th:href="@{/home(page=${curPage - 1}, filter=${currentFilter})}" style="margin-right: 10px;">&#x25C0;</a>
    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <a th:href="@{/home(page=${i}, filter=${currentFilter})}"
        th:text="${i + 1}"
        th:styleappend="${i == curPage} ? 'font-weight:bold; background-color:#007BFF; color:white; padding:4px 10px; border-radius:4px; text-decoration:none;' : 'padding:4px 10px; text-decoration:none;'">
      </a>
    </span>
    <a th:if="${curPage + 1 < totalPages}" th:href="@{/home(page=${curPage + 1}, filter=${currentFilter})}" style="margin-left: 10px;">&#x25B6;</a>
  </div>
</body>

</html>
