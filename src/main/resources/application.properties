spring.application.name=booking
server.port=8082

# Logging configuration
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %highlight(%-5level) %clr(%logger{200}){cyan} %clr(-){faint} %msg%n

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/booking
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# run data.sql on startup
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

#Firebase
firebase.service.account.key.path=keys/firebase.json

# jwt configuration
jwt.secret=S2EwMWN5SzhKa0dUeE9VVUpnemFqSDlqaDhNSDRLRzc=
jwt.expiration=3d

#Flyway configuration
spring.flyway.enabled=true
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.schemas=booking
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# DevTools - exclude Firebase from restart classloader
spring.devtools.restart.additional-exclude=com/google/firebase/**
